    .typewriter { color: var(--c-teal); min-height: 1.55em; }

</head>
<body>
  <nav class="crumbs"><a href="../">~/</a> / about</nav>

  <h1>about/</h1>
  <p class="typewriter" id="tw"></p>

  <h2>Listy</h2>
  <ul>
    <li><a href="bio.md">bio.md</a> — krátké představení</li>
    <li><a href="hodnoty.md">hodnoty.md</a> — jak pracuju</li>

  <footer class="foot">
    <span>~/about<span class="cursor">_</span></span>
    <a href="../">zpět na rozcestník</a>
  </footer>

  <script>
    (function () {
      const text = 'Kdo jsem, jak pracuju, kde jsem byl.';
      const el = document.getElementById('tw');
      let i = 0;
      function step() {
        if (i <= text.length) {
          el.textContent = text.slice(0, i++);
          setTimeout(step, 35);
        }
      }
      step();
    })();
  </script>
</body>
